<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VieForce Patrol — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/patrol.css">
<style>
  /* Admin overrides — wider layout for desktop */
  body {
    max-width: 960px;
  }

  .admin-body {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  /* Stats row */
  .admin-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 16px 0;
  }
  .admin-stat-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px;
    border: 1px solid #eee;
    animation: fadeIn 0.3s ease;
  }
  .admin-stat-card .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    color: #888;
  }
  .admin-stat-card .value {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin-top: 2px;
  }

  /* Action bar */
  .admin-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0 12px;
  }
  .admin-actions input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--mid);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
  }
  .admin-actions input:focus {
    outline: none;
    border-color: var(--blue);
  }
  .admin-actions .btn-action {
    flex-shrink: 0;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-add {
    background: var(--green);
    color: var(--white);
  }
  .btn-export {
    background: var(--white);
    color: var(--navy);
    border: 1px solid var(--navy) !important;
  }

  /* Table */
  .admin-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius);
    border: 1px solid #eee;
    background: var(--white);
  }
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .admin-table th {
    background: var(--navy);
    color: var(--white);
    text-transform: uppercase;
    font-size: 10px;
    font-weight: 700;
    padding: 10px 12px;
    text-align: left;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .admin-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
    white-space: nowrap;
  }
  .admin-table tr:hover {
    background: #fafafa;
  }

  /* Role badge */
  .role-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .role-badge.tsr   { background: rgba(0,166,206,0.12); color: var(--blue); }
  .role-badge.dsm   { background: rgba(241,177,29,0.15); color: #b8860b; }
  .role-badge.rsm   { background: rgba(149,201,61,0.15); color: #5a8a0a; }
  .role-badge.admin  { background: rgba(0,77,113,0.1);  color: var(--navy); }

  /* Status badge */
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .status-badge.active   { background: rgba(149,201,61,0.15); color: #5a8a0a; }
  .status-badge.inactive { background: rgba(226,27,144,0.1);  color: var(--pink); }

  /* Action buttons in table */
  .tbl-btn {
    background: none;
    border: 1px solid var(--mid);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--navy);
    margin-right: 4px;
  }
  .tbl-btn:hover {
    background: var(--navy);
    color: var(--white);
    border-color: var(--navy);
  }
  .tbl-btn.danger {
    color: var(--pink);
    border-color: var(--pink);
  }
  .tbl-btn.danger:hover {
    background: var(--pink);
    color: var(--white);
  }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.visible {
    display: flex;
  }

  /* Modal card */
  .modal-card {
    background: var(--white);
    max-width: 480px;
    width: 90%;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    overflow: hidden;
    animation: fadeIn 0.25s ease;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 2px solid var(--navy);
  }
  .modal-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin: 0;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #999;
    padding: 0 4px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--navy); }

  .modal-body {
    padding: 20px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-body .form-group {
    margin-bottom: 14px;
  }
  .modal-body .form-group label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #888;
    display: block;
    margin-bottom: 6px;
  }
  .modal-body .form-group input,
  .modal-body .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--mid);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
  }
  .modal-body .form-group input:focus,
  .modal-body .form-group select:focus {
    outline: none;
    border-color: var(--blue);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #eee;
  }
  .modal-footer .btn-cancel {
    padding: 10px 20px;
    background: var(--white);
    color: var(--dark);
    border: 1px solid var(--mid);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-footer .btn-save {
    padding: 10px 20px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-footer .btn-reset-pin {
    padding: 10px 20px;
    background: var(--gold);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-right: auto;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: var(--white);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    z-index: 600;
    transform: translateX(120%);
    transition: transform 0.3s ease;
    max-width: 320px;
  }
  .toast.visible {
    transform: translateX(0);
  }
  .toast.success { background: var(--green); color: var(--white); }
  .toast.error   { background: var(--pink);  color: var(--white); }

  /* Responsive */
  @media (max-width: 480px) {
    .admin-stats {
      grid-template-columns: repeat(2, 1fr);
    }
    .admin-actions {
      flex-wrap: wrap;
    }
    .admin-actions input {
      width: 100%;
      flex: unset;
    }
    .admin-actions .btn-action {
      flex: 1;
    }
    .admin-table-wrap {
      margin: 0 -16px;
      border-radius: 0;
      border-left: none;
      border-right: none;
    }
    .toast {
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: none;
    }
  }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
  <a href="app.html" class="back-btn" style="text-decoration:none;">&#8592;</a>
  <div style="flex:1;">
    <h1>Sales Admin</h1>
    <div class="subtitle" id="admin-name">Admin</div>
  </div>
  <button class="action-btn" onclick="logout()">Logout</button>
</div>

<div class="admin-body">

  <!-- ===== SUMMARY STATS ===== -->
  <div class="admin-stats">
    <div class="admin-stat-card">
      <div class="label">Total Users</div>
      <div class="value" id="admin-stat-users">—</div>
    </div>
    <div class="admin-stat-card">
      <div class="label">Active TSRs</div>
      <div class="value" id="admin-stat-active">—</div>
    </div>
    <div class="admin-stat-card">
      <div class="label">Stores Mapped</div>
      <div class="value" id="admin-stat-stores">—</div>
    </div>
    <div class="admin-stat-card">
      <div class="label">Visits This Week</div>
      <div class="value" id="admin-stat-visits">—</div>
    </div>
  </div>

  <!-- ===== ACTION BAR ===== -->
  <div class="admin-actions">
    <input type="text" id="admin-search" placeholder="Search by name or phone...">
    <button class="btn-action btn-add" onclick="openAddUserModal()">+ Add User</button>
    <button class="btn-action btn-export" onclick="exportUsersCSV()">Export CSV</button>
  </div>

  <!-- ===== USER TABLE ===== -->
  <div class="admin-table-wrap">
    <table class="admin-table" id="admin-user-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Region</th>
          <th>Territory</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="admin-user-tbody">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>

</div>

<!-- ===== ADD USER MODAL ===== -->
<div class="modal-overlay" id="modal-add-user" onclick="closeModalOnOverlay(event, 'modal-add-user')">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Add New User</h2>
      <button class="modal-close" onclick="closeModal('modal-add-user')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="add-name" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="add-phone" required placeholder="09XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>PIN</label>
        <input type="password" id="add-pin" required maxlength="6" placeholder="4-6 digit PIN">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="add-role">
          <option value="tsr">TSR</option>
          <option value="dsm">DSM</option>
          <option value="rsm">RSM</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Region</label>
        <input type="text" id="add-region" placeholder="e.g. Luzon">
      </div>
      <div class="form-group">
        <label>District</label>
        <input type="text" id="add-district" placeholder="e.g. Metro Manila">
      </div>
      <div class="form-group">
        <label>Territory</label>
        <input type="text" id="add-territory" placeholder="e.g. MM-North">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-add-user')">Cancel</button>
      <button class="btn-save" onclick="saveNewUser()">Save User</button>
    </div>
  </div>
</div>

<!-- ===== EDIT USER MODAL ===== -->
<div class="modal-overlay" id="modal-edit-user" onclick="closeModalOnOverlay(event, 'modal-edit-user')">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit User</h2>
      <button class="modal-close" onclick="closeModal('modal-edit-user')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-user-id">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="edit-name" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="edit-phone" required placeholder="09XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="edit-role">
          <option value="tsr">TSR</option>
          <option value="dsm">DSM</option>
          <option value="rsm">RSM</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Region</label>
        <input type="text" id="edit-region" placeholder="e.g. Luzon">
      </div>
      <div class="form-group">
        <label>District</label>
        <input type="text" id="edit-district" placeholder="e.g. Metro Manila">
      </div>
      <div class="form-group">
        <label>Territory</label>
        <input type="text" id="edit-territory" placeholder="e.g. MM-North">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-reset-pin" onclick="resetUserPIN()">Reset PIN</button>
      <button class="btn-cancel" onclick="closeModal('modal-edit-user')">Cancel</button>
      <button class="btn-save" onclick="saveEditUser()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="admin-toast"></div>

<!-- ===== SCRIPTS ===== -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
<script>
  // Auth gate — admin only
  var session = getSession();
  if (!session || session.role !== 'admin') {
    window.location.href = 'app.html';
  } else {
    document.getElementById('admin-name').textContent = session.name || 'Admin';
    initAdmin();
  }

  // Wire search
  document.getElementById('admin-search').addEventListener('input', function() {
    searchUsers(this.value);
  });
</script>

</body>
</html>

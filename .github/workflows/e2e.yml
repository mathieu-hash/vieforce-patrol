name: E2E Playwright

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests (local static server)
        run: npm run test:e2e:all
        env:
          CI: true
          PATROL_E2E_LOCAL: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Production smoke (@smoke tag)
        run: npm run test:e2e:prod-smoke
        env:
          CI: true
          PATROL_E2E_PROD: '1'
          PATROL_E2E_LOCAL: '0'

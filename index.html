<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VieForce Patrol — Login (Beta)</title>
<script>
(function() {
  try {
    var t = localStorage.getItem('patrol_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/patrol.css?v=22">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1923">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    if ((window.location.search || '').indexOf('nosw=1') !== -1) return;
    if (localStorage.getItem('patrol_nosw') === '1') return;
  } catch (e) {}
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  });
})();
</script>
<style>
/* Login page dark navy + flower watermark — inlined to bypass CSS cache */
html, body { background: #0F1923 !important; margin: 0; height: 100vh; overflow: hidden; }
.login-page {
  background: #0F1923 !important;
  height: 100vh; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 24px;
  position: relative; overflow: hidden;
  box-sizing: border-box;
}
@media (max-height: 700px) {
  .logo img { width: 180px !important; height: 180px !important; }
  .login-page { padding: 12px 24px; }
}
@media (max-height: 560px) {
  .logo img { width: 120px !important; height: 120px !important; }
  .login-page h1 { font-size: 18px !important; }
}
.login-page::before {
  content: '';
  position: fixed;
  bottom: -30%; right: -35%;
  width: 140vw; height: 140vw;
  background-image: url('icons/vienovo-flower.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.1;
  filter: brightness(0) invert(1);
  pointer-events: none;
  z-index: 0;
}
.login-page > * { position: relative; z-index: 1; }
.login-page h1 { color: #FFFFFF !important; font-size: 24px; font-weight: 800; }
.login-page p { color: rgba(255,255,255,0.4) !important; font-size: 12px; }
.login-box {
  background: rgba(255,255,255,0.05) !important;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1) !important;
  border-radius: 16px !important;
  padding: 24px !important;
  width: 100% !important;
  max-width: 400px !important;
  margin-top: 8px !important;
  box-sizing: border-box !important;
}
.login-box label {
  color: rgba(255,255,255,0.6) !important;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
}
.login-box input {
  background: rgba(255,255,255,0.08) !important;
  border: 1px solid rgba(255,255,255,0.15) !important;
  color: #FFFFFF !important;
  border-radius: 8px !important;
}
.login-box input::placeholder { color: rgba(255,255,255,0.35) !important; }
.login-box input:focus { border-color: #00A6CE !important; background: rgba(0,174,239,0.08) !important; }
.login-btn {
  background: #00A6CE !important; color: white !important;
  min-height: 64px !important; font-size: 16px !important;
  font-weight: 700 !important; border: none !important;
  border-radius: 8px !important; width: 100% !important;
}
.login-btn.secondary {
  background: rgba(255,255,255,0.12) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
  min-height: 52px !important;
  margin-top: 8px !important;
}
.login-option-title {
  color: rgba(255,255,255,0.7);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0 0 8px 0;
}
.login-divider {
  margin: 14px 0;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.login-lang-bar { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }
.login-lang-btn {
  background: rgba(255,255,255,0.1) !important;
  color: rgba(255,255,255,0.7) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
  border-radius: 20px !important;
  padding: 4px 12px !important;
  font-size: 11px !important; font-weight: 700 !important;
  cursor: pointer !important;
}
.login-lang-btn.active {
  background: #00A6CE !important;
  color: white !important;
  border-color: #00A6CE !important;
}
.login-footer { color: rgba(255,255,255,0.25) !important; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="login-page">
  <div class="login-lang-bar">
    <button onclick="switchLoginLang('TL')" id="pill-TL" class="lang-pill login-lang-btn" data-lang="TL">TL</button>
    <button onclick="switchLoginLang('BIS')" id="pill-BIS" class="lang-pill login-lang-btn" data-lang="BIS">BIS</button>
    <button onclick="switchLoginLang('EN')" id="pill-EN" class="lang-pill login-lang-btn" data-lang="EN">EN</button>
  </div>

  <div class="logo" style="background:none;width:auto;height:auto;font-size:0;box-shadow:none;margin-bottom:16px"><img src="icons/patrol-logo.png?v=2" style="width:280px;height:280px;object-fit:contain" alt="VieForce Elite Patrol"></div>
  <h1>VieForce Patrol</h1>
  <p>Vienovo Philippines Inc.</p>

  <div class="login-box">
    <p class="login-option-title" id="lbl-tsr-section">TSR Login (Phone + PIN)</p>
    <label id="lbl-phone">Phone Number</label>
    <input type="tel" id="login-phone" placeholder="09XX XXX XXXX">

    <label id="lbl-pin">PIN Code</label>
    <input type="password" id="login-pin" maxlength="6" placeholder="Enter PIN">

    <button class="login-btn" id="login-btn">Mag-sign in</button>

    <div class="login-divider"></div>
    <p class="login-option-title" id="lbl-manager-section">Manager Login (Google)</p>
    <button class="login-btn secondary" id="google-login-btn">Open with your Vienovo Google email</button>
    <p class="login-localhost-hint" id="login-localhost-hint" style="display:none;color:rgba(255,200,120,0.95);font-size:11px;line-height:1.45;margin:10px 0 0;text-align:center">
      You are on <strong>localhost</strong> — Google returns here, so this port must be running. For production login use
      <a href="https://vieforce-patrol.vercel.app/index.html#patrol_google=1" style="color:#7dd3fc;font-weight:700">vieforce-patrol.vercel.app</a>.
    </p>

    <div class="error-msg" id="login-error"></div>
  </div>

  <div class="login-footer">v1.0 — Vienovo Philippines Inc.</div>
</div>

<script src="js/labels-v2.js?v=11"></script>
<script src="config.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/release-channel.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/validate.js"></script>
<script src="js/auth.js?v=24"></script>
<script>
  // Apply saved language to login screen
  function applyLoginLang() {
    var lang = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
    var L = LABELS[lang] || LABELS['TL'];
    document.getElementById('lbl-phone').textContent = L.phoneLabel;
    document.getElementById('lbl-pin').textContent = L.pinLabel;
    document.getElementById('login-btn').textContent = L.signIn;
    var tsrSec = document.getElementById('lbl-tsr-section');
    var mgrSec = document.getElementById('lbl-manager-section');
    var googleBtn = document.getElementById('google-login-btn');
    if (tsrSec && L.tsrLoginSection) tsrSec.textContent = L.tsrLoginSection;
    if (mgrSec && L.managerLoginSection) mgrSec.textContent = L.managerLoginSection;
    if (googleBtn && L.googleSignIn) googleBtn.textContent = L.googleSignIn;
    document.querySelectorAll('.lang-pill').forEach(function(btn) {
      if (btn.dataset.lang === lang) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  function switchLoginLang(lang) {
    lang = String(lang).toUpperCase();
    if (lang !== 'TL' && lang !== 'BIS' && lang !== 'EN') return;
    localStorage.setItem('patrol_lang', lang);
    window.currentLang = lang;
    applyLoginLang();
  }

  applyLoginLang();

  if (typeof warnPatrolOAuthEnvironment === 'function') warnPatrolOAuthEnvironment();

  (function showLocalhostGoogleHint() {
    var h = '';
    try {
      h = String(location.hostname || '').toLowerCase();
    } catch (e) {}
    if (h === 'localhost' || h === '127.0.0.1') {
      var el = document.getElementById('login-localhost-hint');
      if (el) el.style.display = 'block';
    }
  })();

  document.getElementById('login-btn').addEventListener('click', async function() {
    var lang = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
    var L = LABELS[lang] || LABELS['TL'];
    const phone = document.getElementById('login-phone').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    const errorEl = document.getElementById('login-error');
    const btn = this;

    errorEl.classList.remove('visible');
    errorEl.textContent = '';

    if (!phone || !pin) {
      errorEl.textContent = L.enterPhonePin;
      errorEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = L.signingIn;

    try {
      const result = await login(phone, pin);
      if (result && result.success) {
        // Redirect on the next paint for faster perceived login.
        // Keeping async scheduling preserves mobile WebView storage reliability.
        var go = function() {
          if (typeof redirectAfterLogin === 'function') {
            redirectAfterLogin(result.session);
          } else {
            window.location.href = 'app.html';
          }
        };
        if (typeof window.requestAnimationFrame === 'function') {
          window.requestAnimationFrame(go);
        } else {
          setTimeout(go, 0);
        }
        return;
      } else {
        errorEl.textContent = (result && result.error) || L.invalidLogin;
        errorEl.classList.add('visible');
      }
    } catch (err) {
      errorEl.textContent = err.message || L.loginFailed;
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = L.signIn;
    }
  });

  document.getElementById('google-login-btn').addEventListener('click', async function() {
    var lang = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
    var L = LABELS[lang] || LABELS['TL'];
    var hostLc = '';
    try {
      hostLc = String(location.hostname || '').toLowerCase();
    } catch (e) {}
    if (hostLc === 'localhost' || hostLc === '127.0.0.1') {
      var prodBase = (window.CONFIG && CONFIG.OAUTH_PUBLIC_ORIGIN)
        ? String(CONFIG.OAUTH_PUBLIC_ORIGIN).replace(/\/$/, '')
        : 'https://vieforce-patrol.vercel.app';
      window.location.href = prodBase + '/index.html#patrol_google=1';
      return;
    }

    const errorEl = document.getElementById('login-error');
    const btn = this;
    errorEl.classList.remove('visible');
    errorEl.textContent = '';

    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = L.openingGoogle || 'Opening Google...';
    try {
      const result = await loginWithGoogle();
      if (!result || !result.success) {
        errorEl.textContent = (result && result.error) || L.googleLoginFailed || L.loginFailed;
        errorEl.classList.add('visible');
      }
    } catch (err) {
      errorEl.textContent = err.message || L.googleLoginFailed || L.loginFailed;
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = prevText;
    }
  });

  (async function initLoginPageAuth() {
    var autoGoogleAfterBounce = false;
    if (location.hash === '#patrol_google' || location.hash === '#patrol_google=1') {
      autoGoogleAfterBounce = true;
      try {
        history.replaceState({}, document.title, location.pathname + location.search);
      } catch (h) {}
    }
    // OAuth callback params (?code=, error, hash access_token) MUST take precedence over
    // any stale patrol_session in localStorage — otherwise a previous user's session can
    // short-circuit a fresh Google sign-in and the new identity is silently dropped.
    var hasOAuthCallback = (function () {
      try {
        var qs = new URLSearchParams(location.search || '');
        if (qs.get('code') || qs.get('error') || qs.get('error_code') || qs.get('error_description')) return true;
        if ((location.hash || '').indexOf('access_token=') !== -1) return true;
      } catch (_e) {}
      return false;
    })();

    if (hasOAuthCallback) {
      try { localStorage.removeItem('patrol_session'); } catch (_eClear) {}
    }

    try {
      if (!hasOAuthCallback && getSession()) {
        window.location.href = 'app.html';
        return;
      }

      if (typeof maybeHandleGoogleLoginOnLoad === 'function') {
        var oauthResult = await maybeHandleGoogleLoginOnLoad();
        if (oauthResult && oauthResult.success) {
          if (typeof redirectAfterLogin === 'function') {
            redirectAfterLogin(oauthResult.session);
          } else {
            window.location.href = 'app.html';
          }
          return;
        }

        if (oauthResult && oauthResult.handled && oauthResult.error) {
          var errorEl = document.getElementById('login-error');
          errorEl.textContent = oauthResult.error;
          errorEl.classList.add('visible');
        }
      }

      if (autoGoogleAfterBounce) {
        var h2 = '';
        try {
          h2 = String(location.hostname || '').toLowerCase();
        } catch (e2) {}
        if (h2 !== 'localhost' && h2 !== '127.0.0.1' && typeof loginWithGoogle === 'function') {
          var langG = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
          var LG = LABELS[langG] || LABELS['TL'];
          var gr = await loginWithGoogle();
          if (!gr || !gr.success) {
            var errG = document.getElementById('login-error');
            if (errG) {
              errG.textContent = (gr && gr.error) ? gr.error : (LG.googleLoginFailed || LG.loginFailed);
              errG.classList.add('visible');
            }
          }
        }
      }
    } catch (e) {
      var errBox = document.getElementById('login-error');
      if (errBox) {
        errBox.textContent = (e && e.message) ? e.message : 'Login check failed. Please refresh and try again.';
        errBox.classList.add('visible');
      }
    }
  })();

  // SW permanently removed — kill script in <head> handles cleanup
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VieForce Patrol — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/patrol.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// Kill any existing service worker permanently
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(function(regs) {
      regs.forEach(function(reg) { reg.unregister(); });
    });
  if ('caches' in window) {
    caches.keys().then(function(names) {
      names.forEach(function(name) { caches.delete(name); });
    });
  }
}
</script>
</head>
<body>

<div class="login-page" style="position:relative">
  <!-- Language switcher — top-right corner -->
  <div class="login-lang-bar">
    <button class="login-lang-btn" data-lang="TL" onclick="switchLoginLang('TL')">TL</button>
    <button class="login-lang-btn" data-lang="BIS" onclick="switchLoginLang('BIS')">BIS</button>
    <button class="login-lang-btn" data-lang="EN" onclick="switchLoginLang('EN')">EN</button>
  </div>

  <div class="logo" style="background:none;width:auto;height:auto;font-size:0;box-shadow:none"><img src="icons/patrol-logo.png" style="width:80px;height:80px;object-fit:contain" alt="VIEPro Elite Patrol"></div>
  <h1>VieForce Patrol</h1>
  <p>Vienovo Philippines Inc.</p>

  <div class="login-box">
    <label id="lbl-phone">Phone Number</label>
    <input type="tel" id="login-phone" placeholder="09XX XXX XXXX">

    <label id="lbl-pin">PIN Code</label>
    <input type="password" id="login-pin" maxlength="6" placeholder="Enter PIN">

    <button class="login-btn" id="login-btn">Sign In</button>

    <div class="error-msg" id="login-error"></div>
  </div>

  <div class="login-footer">v1.0 — Vienovo Philippines Inc.</div>
</div>

<script src="js/labels-v2.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/validate.js"></script>
<script src="js/auth.js"></script>
<script>
  // Apply saved language to login screen
  function applyLoginLang() {
    var lang = localStorage.getItem('patrol_lang') || 'TL';
    var L = LABELS[lang] || LABELS['TL'];
    document.getElementById('lbl-phone').textContent = L.phoneLabel;
    document.getElementById('lbl-pin').textContent = L.pinLabel;
    document.getElementById('login-btn').textContent = L.signIn;
    // Mark active pill
    document.querySelectorAll('.login-lang-btn').forEach(function(btn) {
      if (btn.dataset.lang === lang) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  function switchLoginLang(lang) {
    if (['TL','BIS','EN'].indexOf(lang) === -1) return;
    localStorage.setItem('patrol_lang', lang);
    currentLang = lang;
    applyLoginLang();
  }

  applyLoginLang();

  document.getElementById('login-btn').addEventListener('click', async function() {
    var lang = localStorage.getItem('patrol_lang') || 'TL';
    var L = LABELS[lang] || LABELS['TL'];
    const phone = document.getElementById('login-phone').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    const errorEl = document.getElementById('login-error');
    const btn = this;

    errorEl.classList.remove('visible');
    errorEl.textContent = '';

    if (!phone || !pin) {
      errorEl.textContent = L.enterPhonePin;
      errorEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = L.signingIn;

    try {
      const result = await login(phone, pin);
      if (result && result.success) {
        // Small delay ensures localStorage flushes on mobile WebViews before navigation
        setTimeout(function() {
          window.location.href = 'app.html';
        }, 100);
        return;
      } else {
        errorEl.textContent = (result && result.error) || L.invalidLogin;
        errorEl.classList.add('visible');
      }
    } catch (err) {
      errorEl.textContent = err.message || L.loginFailed;
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = L.signIn;
    }
  });

  // If already logged in, redirect
  if (getSession()) {
    window.location.href = 'app.html';
  }

  // SW permanently removed — kill script in <head> handles cleanup
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VieForce Patrol — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/patrol.css?v=17">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1923">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// Kill any existing service worker permanently
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(function(regs) {
      regs.forEach(function(reg) { reg.unregister(); });
    });
  if ('caches' in window) {
    caches.keys().then(function(names) {
      names.forEach(function(name) { caches.delete(name); });
    });
  }
}
</script>
<style>
/* Login page dark navy + flower watermark — inlined to bypass CSS cache */
html, body { background: #0F1923 !important; margin: 0; height: 100vh; overflow: hidden; }
.login-page {
  background: #0F1923 !important;
  height: 100vh; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 24px;
  position: relative; overflow: hidden;
  box-sizing: border-box;
}
@media (max-height: 700px) {
  .logo img { width: 180px !important; height: 180px !important; }
  .login-page { padding: 12px 24px; }
}
@media (max-height: 560px) {
  .logo img { width: 120px !important; height: 120px !important; }
  .login-page h1 { font-size: 18px !important; }
}
.login-page::before {
  content: '';
  position: fixed;
  bottom: -30%; right: -35%;
  width: 140vw; height: 140vw;
  background-image: url('icons/vienovo-flower.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.1;
  filter: brightness(0) invert(1);
  pointer-events: none;
  z-index: 0;
}
.login-page > * { position: relative; z-index: 1; }
.login-page h1 { color: #FFFFFF !important; font-size: 24px; font-weight: 800; }
.login-page p { color: rgba(255,255,255,0.4) !important; font-size: 12px; }
.login-box {
  background: rgba(255,255,255,0.05) !important;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1) !important;
  border-radius: 16px !important;
}
.login-box label {
  color: rgba(255,255,255,0.6) !important;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
}
.login-box input {
  background: rgba(255,255,255,0.08) !important;
  border: 1px solid rgba(255,255,255,0.15) !important;
  color: #FFFFFF !important;
  border-radius: 8px !important;
}
.login-box input::placeholder { color: rgba(255,255,255,0.35) !important; }
.login-box input:focus { border-color: #00A6CE !important; background: rgba(0,174,239,0.08) !important; }
.login-btn {
  background: #00A6CE !important; color: white !important;
  min-height: 64px !important; font-size: 16px !important;
  font-weight: 700 !important; border: none !important;
  border-radius: 8px !important; width: 100% !important;
}
.login-lang-bar { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }
.login-lang-btn {
  background: rgba(255,255,255,0.1) !important;
  color: rgba(255,255,255,0.7) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
  border-radius: 20px !important;
  padding: 4px 12px !important;
  font-size: 11px !important; font-weight: 700 !important;
  cursor: pointer !important;
}
.login-lang-btn.active {
  background: #00A6CE !important;
  color: white !important;
  border-color: #00A6CE !important;
}
.login-footer { color: rgba(255,255,255,0.25) !important; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="login-page">
  <!-- Language switcher — top-right corner -->
  <div class="login-lang-bar">
    <button onclick="switchLoginLang('TL')" id="pill-TL" class="lang-pill login-lang-btn" data-lang="TL">TL</button>
    <button onclick="switchLoginLang('BIS')" id="pill-BIS" class="lang-pill login-lang-btn" data-lang="BIS">BIS</button>
    <button onclick="switchLoginLang('EN')" id="pill-EN" class="lang-pill login-lang-btn" data-lang="EN">EN</button>
  </div>

  <div class="logo" style="background:none;width:auto;height:auto;font-size:0;box-shadow:none;margin-bottom:16px"><img src="icons/patrol-logo.png" style="width:280px;height:280px;object-fit:contain;mix-blend-mode:lighten" alt="VIEPro Elite Patrol"></div>
  <h1>VieForce Patrol</h1>
  <p>Vienovo Philippines Inc.</p>

  <div class="login-box">
    <label id="lbl-phone">Phone Number</label>
    <input type="tel" id="login-phone" placeholder="09XX XXX XXXX">

    <label id="lbl-pin">PIN Code</label>
    <input type="password" id="login-pin" maxlength="6" placeholder="Enter PIN">

    <button class="login-btn" id="login-btn">Mag-sign in</button>

    <div class="error-msg" id="login-error"></div>
  </div>

  <div class="login-footer">v1.0 — Vienovo Philippines Inc.</div>
</div>

<script src="js/labels-v2.js?v=9"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/validate.js"></script>
<script src="js/auth.js"></script>
<script>
  // Apply saved language to login screen
  function applyLoginLang() {
    var lang = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
    var L = LABELS[lang] || LABELS['TL'];
    document.getElementById('lbl-phone').textContent = L.phoneLabel;
    document.getElementById('lbl-pin').textContent = L.pinLabel;
    document.getElementById('login-btn').textContent = L.signIn;
    // Mark active pill
    document.querySelectorAll('.lang-pill').forEach(function(btn) {
      if (btn.dataset.lang === lang) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  function switchLoginLang(lang) {
    lang = String(lang).toUpperCase();
    if (lang !== 'TL' && lang !== 'BIS' && lang !== 'EN') return;
    localStorage.setItem('patrol_lang', lang);
    window.currentLang = lang;
    applyLoginLang();
  }

  applyLoginLang();

  document.getElementById('login-btn').addEventListener('click', async function() {
    var lang = (localStorage.getItem('patrol_lang') || 'TL').toUpperCase();
    var L = LABELS[lang] || LABELS['TL'];
    const phone = document.getElementById('login-phone').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    const errorEl = document.getElementById('login-error');
    const btn = this;

    errorEl.classList.remove('visible');
    errorEl.textContent = '';

    if (!phone || !pin) {
      errorEl.textContent = L.enterPhonePin;
      errorEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = L.signingIn;

    try {
      const result = await login(phone, pin);
      if (result && result.success) {
        // Small delay ensures localStorage flushes on mobile WebViews before navigation
        setTimeout(function() {
          if (typeof redirectAfterLogin === 'function') {
            redirectAfterLogin(result.session);
          } else {
            window.location.href = 'app.html';
          }
        }, 100);
        return;
      } else {
        errorEl.textContent = (result && result.error) || L.invalidLogin;
        errorEl.classList.add('visible');
      }
    } catch (err) {
      errorEl.textContent = err.message || L.loginFailed;
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = L.signIn;
    }
  });

  // If already logged in, redirect
  if (getSession()) {
    window.location.href = 'app.html';
  }

  // SW permanently removed — kill script in <head> handles cleanup
</script>

</body>
</html>
